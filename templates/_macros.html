{# Аватар с рамкой: frame — код рамки (none, neon, fire, ice, toxic, rainbow, gold) #}
{% macro avatar(name, frame='none', size='', premium=False) -%}
<i class="avatar fr-{{ frame or 'none' }} {{ size }}">{{ name[:1]|upper }}{% if premium %}<em class="crown" title="Premium">👑</em>{% endif %}</i>
{%- endmacro %}

{# Переключатель светлой/тёмной темы #}
{% macro theme_toggle() -%}
<button type="button" class="theme-toggle" data-theme-toggle title="Сменить тему" aria-label="Сменить тему">
  <svg class="ic moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
  <svg class="ic sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
</button>
{%- endmacro %}
