{% extends "auth_layout.html" %}
{% block title %}Регистрация · FitnessIT{% endblock %}
{% block card %}
  <h2>Создайте аккаунт</h2>
  <p class="sub">Станьте частью зала KBTU — это займёт минуту.</p>
  {% include "_flash.html" %}
  <form method="post" novalidate>
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label for="name">Имя</label>
    <input id="name" name="name" type="text" placeholder="Как вас зовут?"
           value="{{ form.name }}" maxlength="60" autocomplete="name" required>
    <label for="email">Университетский email</label>
    <input id="email" name="email" type="email" placeholder="you@kbtu.kz"
           value="{{ form.email }}" maxlength="120" autocomplete="email" required>
    <label for="password">Пароль</label>
    <input id="password" name="password" type="password" placeholder="Минимум 8 символов"
           maxlength="128" autocomplete="new-password" required>
    <label for="confirm">Повторите пароль</label>
    <input id="confirm" name="confirm" type="password" placeholder="Ещё раз пароль"
           maxlength="128" autocomplete="new-password" required>
    <button type="submit">Зарегистрироваться</button>
  </form>
  <p class="alt">Уже есть аккаунт? <a href="{{ url_for('auth.login') }}">Войти</a></p>
{% endblock %}
