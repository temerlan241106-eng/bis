{% extends "auth_layout.html" %}
{% block title %}Вход · FitnessIT{% endblock %}
{% block card %}
  <h2>С возвращением в зал</h2>
  <p class="sub">Войдите, чтобы посмотреть расписание и записаться на занятие.</p>
  {% include "_flash.html" %}
  <form method="post" novalidate>
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label for="email">Университетский email</label>
    <input id="email" name="email" type="email" placeholder="you@kbtu.kz"
           value="{{ email }}" maxlength="120" autocomplete="email" required>
    <label for="password">Пароль</label>
    <input id="password" name="password" type="password" placeholder="Минимум 8 символов"
           maxlength="128" autocomplete="current-password" required>
    <button type="submit">Войти</button>
  </form>
  <p class="alt">Впервые здесь? <a href="{{ url_for('auth.register') }}">Создать аккаунт</a></p>
{% endblock %}
